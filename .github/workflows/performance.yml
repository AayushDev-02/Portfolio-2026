name: performance

# Stage 7's budgets, enforced. Two gates, deliberately different in kind:
#
#   1. check-budget.mjs is exact and never flaky — it gzips the built chunks
#      and fails if *our* code grows past 15KB. This is the one that catches a
#      careless dependency or a "use client" added too high up the tree.
#   2. Lighthouse is the field measurement, and is somewhat noisy on shared CI
#      runners, so it asserts the Core Web Vitals "good" thresholds rather than
#      PLAN.md's tighter internal LCP target. That tighter number is verified
#      with scripts/measure-perf.mjs against a real deploy, where the numbers
#      mean something.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json already declares
      # "packageManager": "pnpm@9.12.0", and this action refuses to run when a
      # version is specified in both places rather than silently picking one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and lint
        run: pnpm check

      - name: Build
        # Placeholder credentials only. They are never used to reach a service:
        # the build reads them so isContactConfigured() is true and the contact
        # form is included, which is what production ships. Measuring a build
        # with the form gated out would under-report the bundle.
        env:
          RESEND_API_KEY: ci-placeholder
          CONTACT_TO_EMAIL: ci@example.com
          CONTACT_FROM_EMAIL: ci@example.com
          SUPABASE_URL: https://ci.placeholder.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          UPSTASH_REDIS_REST_URL: https://ci.placeholder.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm build

      - name: Bundle budget
        run: node scripts/check-budget.mjs

      - name: Lighthouse
        env:
          RESEND_API_KEY: ci-placeholder
          CONTACT_TO_EMAIL: ci@example.com
          CONTACT_FROM_EMAIL: ci@example.com
          SUPABASE_URL: https://ci.placeholder.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          UPSTASH_REDIS_REST_URL: https://ci.placeholder.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm dlx @lhci/cli@0.14.x autorun
